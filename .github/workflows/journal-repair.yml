# ==============================================================================
# @module  journal-repair.yml
# @about   Модуль автоматизация проверки и исправления файлов расписания.
# @purpose Запуск сценария приведения записей базы данных расписания к стандарту.
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: Проверка и исправление расписания

on:
  push:
    branches:
      - main
    paths:
      - '_data/signal-repair-*.json'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Проверка исходного кода репозитория через личный токен
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_FINE_TOKEN }}
          fetch-depth: 0

      - name: Настройка среды Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установка зависимости PyYAML
        run: pip install pyyaml

      - name: Сохранение исходного сигнала
        run: |
          mkdir -p "$RUNNER_TEMP/repair"
          
          # Находим персональный файл сигнала, прилетевший в коммите
          SIGNAL_PATH=$(ls _data/signal-repair-*.json 2>/dev/null | head -n 1)

          if [ -n "$SIGNAL_PATH" ] && [ -f "$SIGNAL_PATH" ]; then
            cp "$SIGNAL_PATH" "$RUNNER_TEMP/repair/signal-repair.json"
            # Запоминаем точное базовое имя файла для финализатора публикации
            echo "$(basename "$SIGNAL_PATH")" > "$RUNNER_TEMP/repair/signal-filename.txt"
            touch "$RUNNER_TEMP/repair/signal-existed"
          fi

      - name: Запуск проверки и исправления расписания
        id: repair
        run: |
          # Находим имя измененного персонального файла сигнала в папке _data
          SIGNAL_PATH=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^_data/signal-repair-.*\.json$' | head -n 1)
          
          if [ -z "$SIGNAL_PATH" ]; then
            echo "[КРИТИЧЕСКИЙ СБОЙ YML] Не удалось вычислить персональный файл сигнала через git diff-tree!"
            exit 1
          fi
          
          # Вырезаем чистый логин преподавателя из имени файла
          TEACHER_LOGIN=$(basename "$SIGNAL_PATH" | sed 's/signal-repair-//' | sed 's/\.json//')
          echo "[ВОРКФЛОУ] Обнаружен персональный сигнал для преподавателя: $TEACHER_LOGIN"
          
          # Запускаем питоновский диспетчер, передав ему логин в качестве аргумента
          python _actions/journal_repair/journal_repair.py "$TEACHER_LOGIN"

      - name: Финальная очистка сигналов и сохранение изменений
        id: publish
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          # Зряче восстанавливаем имя персонального файла сигнала и вычисляем персональный статус
          if [ -f "$RUNNER_TEMP/repair/signal-filename.txt" ]; then
            SIGNAL_NAME=$(cat "$RUNNER_TEMP/repair/signal-filename.txt")
            TEACHER_LOGIN=$(echo "$SIGNAL_NAME" | sed 's/signal-repair-//' | sed 's/\.json//')
          else
            echo "[ВОРКФЛОУ] Ошибка: Имя персонального сигнала не найдено во временной памяти!"
            exit 1
          fi

          SIGNAL_FILE="_data/$SIGNAL_NAME"
          STATUS_FILE="_data/repair-status-${TEACHER_LOGIN}.json"
          SAVED_SIGNAL="$RUNNER_TEMP/repair/signal-repair.json"
          REMOTE_SIGNAL="$RUNNER_TEMP/repair/remote-signal.json"

          # Получаем актуальную ветку до формирования коммита.
          if ! git fetch origin main; then
            echo "Не удалось связаться с GitHub. Повтор через 10 минут."
            sleep 600
            git fetch origin main
          fi

          # Удаляем только обработанный персональный сигнал.
          if [ -f "$RUNNER_TEMP/repair/signal-existed" ]; then
            if git show "origin/main:$SIGNAL_FILE" > "$REMOTE_SIGNAL" 2>/dev/null; then
              if cmp -s "$SAVED_SIGNAL" "$REMOTE_SIGNAL"; then
                rm -f "$SIGNAL_FILE"
                echo "Исходный персональный сигнал обработан; его можно удалить."
              else
                cp "$REMOTE_SIGNAL" "$SIGNAL_FILE"
                echo "Обнаружен новый сигнал Java для этого преподавателя. Сохраняем его."
              fi
            else
              rm -f "$SIGNAL_FILE"
              echo "Персональный сигнал уже удалён из удалённой ветки."
            fi
          else
            echo "Исходного сигнала нет; новый сигнал не удаляем."
          fi

          git add -A -- _data

          if git diff --cached --quiet; then
            echo "Изменений для публикации нет."
            exit 0
          fi

          git commit -m "проверка: исправление расписания для $TEACHER_LOGIN [skip ci]"

          MAX_ATTEMPTS=3
          RETRY_INTERVAL_SECONDS=600

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Попытка публикации $attempt из $MAX_ATTEMPTS"

            if git push origin HEAD:main; then
              echo "Изменения успешно опубликованы."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi

            if ! git fetch origin main; then
              echo "GitHub недоступен. Повтор через 10 минут."
              sleep "$RETRY_INTERVAL_SECONDS"
              continue
            fi

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Удалённая ветка не опережает локальную. Повтор через 10 минут."
              sleep "$RETRY_INTERVAL_SECONDS"
              continue
            fi

            echo "Обнаружены новые коммиты. Выполняем rebase без ожидания."

            if git rebase origin/main; then
              echo "Rebase завершён. Немедленно повторяем публикацию."
              continue
            fi

            # Разрешаем автоматически только ожидаемые персональные конфликты
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected_conflict=0

            while IFS= read -r file; do
              [ -n "$file" ] || continue

              case "$file" in
                "$STATUS_FILE"|"$SIGNAL_FILE")
                  echo "Конфликт $file: сохраняем актуальную версию origin/main."

                  if git cat-file -e "origin/main:$file" 2>/dev/null; then
                    git checkout --ours -- "$file"
                    git add -- "$file"
                  else
                    git rm -f -- "$file" || true
                  fi
                  ;;
                *)
                  echo "Неожиданный конфликт в $file. Автоматически не разрешаем."
                  unexpected_conflict=1
                  ;;
              esac
            done <<< "$conflicts"

            if [ "$unexpected_conflict" -ne 0 ]; then
              git rebase --abort || true
              echo "Rebase остановлен из-за конфликта вне персональных файлов статуса и сигнала."
              exit 1
            fi

            if ! GIT_EDITOR=true git rebase --continue; then
              if ! git rebase --skip; then
                git rebase --abort || true
                echo "Не удалось завершить rebase."
                exit 1
              fi
            fi

            echo "Конфликт обработан. Повторяем публикацию без десятиминутной паузы."
          done

          echo "Не удалось опубликовать изменения после $MAX_ATTEMPTS попыток."
          exit 1

      - name: Сохранение статуса error при ошибке
        if: ${{ failure() && (steps.repair.outcome == 'failure' || steps.publish.outcome == 'failure') }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Вычисляем логин преподавателя для записи аварийного статуса
          if [ -f "$RUNNER_TEMP/repair/signal-filename.txt" ]; then
            SIGNAL_NAME=$(cat "$RUNNER_TEMP/repair/signal-filename.txt")
            TEACHER_LOGIN=$(echo "$SIGNAL_NAME" | sed 's/signal-repair-//' | sed 's/\.json//')
          else
            TEACHER_LOGIN="unknown"
          fi

          STATUS_FILE="repair-status-${TEACHER_LOGIN}.json"

          # Сохраняем локальный статус до сброса рабочей копии.
          STATUS_BACKUP="$RUNNER_TEMP/repair/status-before-reset.json"

          if [ -f "_data/$STATUS_FILE" ]; then
            cp "_data/$STATUS_FILE" "$STATUS_BACKUP"
          fi

          # Возвращаем рабочую копию к последнему состоянию на GitHub.
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          # Сохраняем только статус ошибки.
          python - "$TEACHER_LOGIN" <<'PY'
          import os
          import sys
          import json
          from datetime import datetime, timezone

          teacher = sys.argv[1] if len(sys.argv) > 1 else "unknown"
          path = os.path.join("_data", f"repair-status-{teacher}.json")
          backup_path = os.path.join(
              os.environ.get("RUNNER_TEMP", ""),
              "repair",
              "status-before-reset.json",
          )

          # Сначала восстанавливаем исходные данные статуса, если они сохранились.
          try:
              with open(backup_path, "r", encoding="utf-8") as f:
                  status = json.load(f)
              if not isinstance(status, dict):
                  status = {}
          except (OSError, json.JSONDecodeError):
              status = {}

          # Сохраняем errorDetails из текущего файла, если он уже существует.
          try:
              with open(path, "r", encoding="utf-8") as f:
                  current_status = json.load(f)
              if isinstance(current_status, dict):
                  status.update(current_status)
          except (OSError, json.JSONDecodeError):
              pass

          status["status"] = "error"
          status["mode"] = status.get("mode", "")
          status["timestamp"] = datetime.now(timezone.utc).isoformat()

          with open(path, "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git add "_data/$STATUS_FILE"

          if git diff --staged --quiet; then
            echo "Статус error уже сохранён."
            exit 0
          fi

          git commit -m "проверка: сохранение статуса ошибки для $TEACHER_LOGIN [skip ci]"

          MAX_ATTEMPTS=3
          RETRY_INTERVAL_SECONDS=600

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Попытка публикации статуса error $attempt из $MAX_ATTEMPTS"

            if git push origin HEAD:main; then
              echo "Статус error успешно опубликован."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi

            if ! git fetch origin main; then
              echo "GitHub недоступен. Повтор через 10 минут."
              sleep "$RETRY_INTERVAL_SECONDS"
              continue
            fi

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Ветка не опережает локальный коммит. Повтор через 10 минут."
              sleep "$RETRY_INTERVAL_SECONDS"
              continue
            fi

            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main

            python - "$TEACHER_LOGIN" <<'PY'
          import os
          import sys
          import json
          from datetime import datetime, timezone

          teacher = sys.argv[1] if len(sys.argv) > 1 else "unknown"
          path = os.path.join("_data", f"repair-status-{teacher}.json")
          backup_path = os.path.join(
              os.environ.get("RUNNER_TEMP", ""),
              "repair",
              "status-before-reset.json",
          )

          # Сначала восстанавливаем исходные данные статуса, если они сохранились.
          try:
              with open(backup_path, "r", encoding="utf-8") as f:
                  status = json.load(f)
              if not isinstance(status, dict):
                  status = {}
          except (OSError, json.JSONDecodeError):
              status = {}

          # Сохраняем errorDetails из текущего файла, если он уже существует.
          try:
              with open(path, "r", encoding="utf-8") as f:
                  current_status = json.load(f)
              if isinstance(current_status, dict):
                  status.update(current_status)
          except (OSError, json.JSONDecodeError):
              pass

          status["status"] = "error"
          status["mode"] = status.get("mode", "")
          status["timestamp"] = datetime.now(timezone.utc).isoformat()

          with open(path, "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

            git add "_data/$STATUS_FILE"
            git commit -m "проверка: сохранение статуса ошибки для $TEACHER_LOGIN [skip ci]"

            echo "Статус error пересоздан поверх актуальной ветки. Повторяем публикацию."
          done

          echo "Не удалось опубликовать статус ошибки после $MAX_ATTEMPTS попыток."
          exit 1
