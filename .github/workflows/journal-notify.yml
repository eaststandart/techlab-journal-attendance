# ==============================================================================
# @module  journal-notify.yml
# @about   Умный диспетчер шлюза на стороне базы данных Журнала
# @purpose Контроль комплектности, фиксация переноса файлов Git и вызов сайта
# @version 5.0.0
# ==============================================================================

name: Smart Journal Submission Notifier

on:
  push:
    paths:
      - '_input/**.json'

permissions:
  contents: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Database Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_FINE_TOKEN }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: pip install pyyaml requests

      - name: Run Smart Bundle Notifier
        env:
          MY_FINE_TOKEN: ${{ secrets.MY_FINE_TOKEN }}
        run: python _actions/journal-notify.py
