# ==============================================================================
# @module  journal-notify.yml
# @about   Конвейер шлюза Журнала
# @purpose Защита от параллельных потоков и запуск диспетчера
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: Smart Journal Submission Notifier

on:
  push:
    paths:
      - '_input/**.json'

permissions:
  contents: write

# Защищаем репозиторий от одновременной работы нескольких диспетчеров.
# Текущий запущенный сервер последовательно обработает все прилетевшие комплекты.
concurrency:
  group: journal-dispatcher
  cancel-in-progress: false

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Database Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install pyyaml requests

      - name: Run Smart Bundle Dispatcher
        env:
          MY_FINE_TOKEN: ${{ secrets.MY_FINE_TOKEN }}
        run: python _actions/journal-notify.py
