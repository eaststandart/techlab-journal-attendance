# ==============================================================================
# @module  trigger.yml
# @about   Сверхмощный лог-сканер сетевого взаимодействия GitHub API
# @purpose Пошаговый аудит токена, прав доступа и листинга репозиториев
# @version 2.0.0
# ==============================================================================

name: Send Signal to Site

on:
  push:
    paths:
      - '_data/**.json'

jobs:
  ping-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: RUN FULL GITHUB API AUDIT LOG
        run: |
          echo "=================== ТЕСТ 1: КТО Я ДЛЯ GITHUB API? ==================="
          curl -s -H "Authorization: token ${{ secrets.MY_ADMIN_TOKEN }}" https://github.com | grep -E "login|id|type" || echo "❌ Токен полностью невалиден!"
          
          echo -e "\n=================== ТЕСТ 2: КАКИЕ РЕПОЗИТОРИИ ВИДИТ ТОКЕН? ==================="
          curl -s -H "Authorization: token ${{ secrets.MY_ADMIN_TOKEN }}" "https://github.com/repos?per_page=100" | grep "full_name" || echo "❌ Токен не видит ни одного репозитория!"
          
          echo -e "\n=================== ТЕСТ 3: ПОЛНЫЙ СЕТЕВОЙ ЛОГ DISPATCHES ==================="
          curl -v -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.MY_ADMIN_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com \
            -d '{"event_type": "journal_submission"}'
