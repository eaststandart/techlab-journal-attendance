# ==============================================================================
# @module  trigger.yml
# @about   Тестовый передатчик удаленного сигнала авторизации
# @purpose Отправка сетевого импульса на запуск DEBUG-робота на стороне сайта
# @version 1.0.0
# ==============================================================================

name: Send Signal to Site

on:
  push:
    paths:
      - '_data/**.json'

jobs:
  ping-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event to Main Site
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.MY_ADMIN_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com \
            -d '{"event_type": "journal_submission"}'
