# ==============================================================================
# @module  trigger.yml
# @about   Тестовый передатчик удаленного сигнала с расширенным логированием
# @purpose Вывод сетевых заголовков и статус-кодов ответа GitHub API в лог консоли
# @version 1.1.0
# ==============================================================================

name: Send Signal to Site

on:
  push:
    paths:
      - '_data/**.json'

jobs:
  ping-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event to Main Site with Full Logging
        run: |
          echo "🌐 [ОТЛАДКА] Отправляем POST запрос на запуск робота сайта..."
          
          RESPONSE=$(curl -i -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.MY_ADMIN_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com \
            -d '{"event_type": "journal_submission"}')
            
          echo "=================== ЛОГ ОТВЕТА СЕРВЕРА GITHUB ==================="
          echo "$RESPONSE"
          echo "================================================================"
