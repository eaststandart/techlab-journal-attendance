# ==============================================================================
# @module  journal-attendance.yml
# @about   Сценарий автоматизации конвейера журнала посещений в GitHub Actions
# @purpose Запуск главного диспетчера при отправке JSON данных в репозиторий базы
# @author  TechLab
# @version 1.1.0
# ==============================================================================

name: Telegram Group Notification

on:
  push:
    paths:
      - '_data/**.json'

jobs:
  telegram-broadcast:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем файлы баз данных из текущего репозитория
      - name: Checkout Data Repository
        uses: actions/checkout@v4

      # 2. Скачиваем программные скрипты Python из основного репозитория сайта
      - name: Checkout Python Scripts From Main Site
        uses: actions/checkout@v4
        with:
          repository: 'eaststandart/eaststandart.github.io'
          path: '_actions_core'

      # 3. Настраиваем окружение Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.10'

      # 4. Устанавливаем библиотеку PyYAML для чтения расписаний
      - name: Install Dependencies
        run: pip install pyyaml

      # 5. Копируем исполняемые скрипты в корень для корректной работы импортов
      - name: Prepare Workspace Scripts
        run: cp -r _actions_core/_actions/* .

      # 6. Запускаем Главный Диспетчер конвейера
      - name: Run Main Dispatcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_ADMIN_TOKEN: ${{ secrets.MY_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python journalattendance.py
