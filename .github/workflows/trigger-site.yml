# ==============================================================================
# @module  trigger-site.yml
# @about   Передатчик удаленного сигнала авторизации
# @purpose Запуск воркфлоу на стороне основного сайта при обновлении базы данных
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: Trigger Site Workflow

on:
  push:
    paths:
      - '_data/**.json'

jobs:
  ping-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event to Main Site
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.MY_ADMIN_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com \
            -d '{"event_type": "journal_submission"}'
