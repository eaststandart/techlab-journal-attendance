# ==============================================================================
# @module  journal_data_repair.yml
# @about   Автоматизация проверки и исправления файлов расписания на сервере Гитхаб
# @purpose Запуск сценария приведения времени и направлений базы данных к стандарту
# @author  TechLab
# @version 10.0.0
# ==============================================================================

name: Проверка и исправление расписания

on:
  push:
    branches:
      - main
    paths:
      - '_data/signal-repair.json'

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка исходного кода репозитория через личный токен
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_FINE_TOKEN }}

      - name: Настройка среды Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установка зависимости PyYAML
        run: pip install pyyaml

      - name: Запуск проверки и исправления расписания
        run: python _actions/journal_data_repair.py

      - name: Финальная очистка сигналов и сохранение изменений
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Физически удаляем входящий файл-сигнал с сервера
          rm -f _data/signal-repair.json
          
          # Добавляем в коммит починенный YAML и измененный JSON статуса
          git add _data/*.yml _data/repair-status.json || true
          git add _data/signal-repair.json || true
          
          if ! git diff --staged --quiet; then
            git commit -m "fix(database): исправление расписания [skip ci]"
            git push origin main
          else
            echo "✨ Изменений в расписании нет, но сигнал успешно очищен."
            git commit -m "chore: очистка входящего сигнала ремонта расписания [skip ci]"
            git push origin main
          fi
