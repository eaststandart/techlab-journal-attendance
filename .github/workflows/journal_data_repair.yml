# ==============================================================================
# @module  journal_data_repair.yml
# @about   Автоматизация проверки и исправления файлов расписания на сервере GitHub
# @purpose Запуск сценария приведения времени и направлений базы данных к стандарту
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: Проверка и исправление расписания

on:
  push:
    branches:
      - main
    paths:
      - '_data/signal-repair.json'

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка исходного кода репозитория через личный токен
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_FINE_TOKEN }}

      - name: Настройка среды Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установка зависимости PyYAML
        run: pip install pyyaml

      - name: Запуск проверки и исправления расписания
        id: repair
        run: python _actions/journal_data_repair.py

      - name: Финальная очистка сигналов и сохранение изменений
        id: publish
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f _data/signal-repair.json
          git add -A -- _data

          if git diff --staged --quiet; then
            echo "Изменений для коммита нет."
            exit 0
          fi

          git commit -m "fix(database): автоматическое исправление расписания [skip ci]"

          MAX_ATTEMPTS=3
          RETRY_INTERVAL_MINUTES=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Попытка публикации $attempt из $MAX_ATTEMPTS"

            if git push origin HEAD:main; then
              echo "Изменения успешно опубликованы."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Публикация не удалась. Повтор через $RETRY_INTERVAL_MINUTES минут."
              sleep "$((RETRY_INTERVAL_MINUTES * 60))"
              git fetch origin main
              git rebase origin/main
            fi
          done

          echo "Не удалось опубликовать изменения после $MAX_ATTEMPTS попыток."
          exit 1

      - name: Сохранение статуса error при ошибке
        if: ${{ failure() && (steps.repair.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.confirm.outcome == 'failure') }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Возвращаем рабочую копию к последнему состоянию на GitHub.
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          # Сохраняем только статус ошибки.
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "_data/repair-status.json"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  status = json.load(f)
              if not isinstance(status, dict):
                  status = {}
          except (OSError, json.JSONDecodeError):
              status = {}

          status["status"] = "error"
          status["timestamp"] = datetime.now(timezone.utc).isoformat()

          with open(path, "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git add _data/repair-status.json

          if git diff --staged --quiet; then
            echo "Статус error уже сохранён."
            exit 0
          fi

          git commit -m "fix(database): сохранение статуса ошибки [skip ci]"

          MAX_ATTEMPTS=3
          RETRY_INTERVAL_MINUTES=10

 
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Попытка публикации статуса ошибки $attempt из $MAX_ATTEMPTS"

            if git push origin HEAD:main; then
              echo "Статус error успешно опубликован."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Публикация статуса не удалась. Повтор через $RETRY_INTERVAL_MINUTES минут."
              sleep "$((RETRY_INTERVAL_MINUTES * 60))"

              if ! git fetch origin main; then
                echo "Не удалось получить актуальную версию main."
                continue
              fi

              git rebase --abort 2>/dev/null || true

              if ! git rebase origin/main; then
                echo "Не удалось выполнить rebase. Подготовка повторной попытки."
                git rebase --abort 2>/dev/null || true
                git reset --hard origin/main

                python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "_data/repair-status.json"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  status = json.load(f)
              if not isinstance(status, dict):
                  status = {}
          except (OSError, json.JSONDecodeError):
              status = {}

          status["status"] = "error"
          status["timestamp"] = datetime.now(timezone.utc).isoformat()

          with open(path, "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

                git add _data/repair-status.json
                git commit -m "fix(database): сохранение статуса ошибки [skip ci]"
              fi
            fi
          done

          echo "Не удалось опубликовать статус ошибки."
          exit 1

      - name: Подтверждение успешного исправления
        id: confirm
        if: ${{ success() }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "_data/repair-status.json"

          with open(path, "r", encoding="utf-8") as f:
              status = json.load(f)

          if status.get("status") != "on":
              print("Статус не 'on'. Подтверждение не требуется.")
              raise SystemExit(0)

          status["status"] = "off"
          status["timestamp"] = datetime.now(timezone.utc).isoformat()

          with open(path, "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY


          git add _data/repair-status.json
          git commit -m "fix(database): подтверждение завершения исправления [skip ci]"

          MAX_ATTEMPTS=3
          RETRY_INTERVAL_MINUTES=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Попытка публикации статуса off $attempt из $MAX_ATTEMPTS"

            if git push origin HEAD:main; then
              echo "Статус off успешно опубликован."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Публикация не удалась. Повтор через $RETRY_INTERVAL_MINUTES минут."
              sleep "$((RETRY_INTERVAL_MINUTES * 60))"

              if ! git fetch origin main; then
                echo "Не удалось получить актуальную версию main."
                continue
              fi

              if ! git rebase origin/main; then
                echo "Не удалось выполнить rebase."
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
            fi
          done

          echo "Не удалось опубликовать статус off после $MAX_ATTEMPTS попыток."
          exit 1

